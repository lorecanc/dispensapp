# Koyeb App spec — deploy backend FastAPI via Dockerfile (root)
# Ref: https://www.koyeb.com/docs/reference/koyeb-yaml
#
# Deploy:
#   koyeb app init inventario --docker Dockerfile --env PORT=8000 --env DATABASE_URL=... --env CORS_ORIGINS=...
# oppure: koyeb deploy --koyeb-yaml koyeb.yaml  (se usi koyeb CLI con git)
# Oppure connetti repo GitHub da dashboard e seleziona Dockerfile in root.

name: inventario
services:
  - name: api
    type: web
    # Build dal Dockerfile in root (WORKDIR /app, COPY backend ./backend)
    docker:
      dockerfile: ./Dockerfile
    # Koyeb inietta $PORT; CMD del Dockerfile usa ${PORT:-8000}
    ports:
      - port: 8000
        protocol: http
    routes:
      - path: /
        port: 8000
    env:
      # Obbligatoria in prod — es. Neon Postgres
      # formato: postgresql://user:pass@host/db?sslmode=require
      - name: DATABASE_URL
        value: postgresql://user:password@ep-xxx.neon.tech/neondb?sslmode=require
      # CORS — lista comma-separated dei frontend permessi
      # aggiungi il dominio Koyeb del frontend e/o custom domain
      - name: CORS_ORIGINS
        value: https://tuo-frontend.koyeb.app,https://app.example.com
    # Health check su docs (FastAPI genera /docs)
    health_checks:
      - port: 8000
        path: /docs
        interval: 30s
        timeout: 5s
    instance_type: nano
    regions:
      - fra
    scaling:
      min: 1
      max: 1
