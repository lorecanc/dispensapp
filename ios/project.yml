name: Inventario
options:
  bundleIdPrefix: com.inventario
  deploymentTarget:
    iOS: "17.0"
  # Nessun pin xcodeVersion: la chiave è opzionale e "15.0" era incoerente con
  # le feature usate (nonisolated(unsafe) richiede toolchain 5.10+, qui 26.x).

settings:
  base:
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1

targets:
  Inventario:
    type: application
    platform: iOS
    sources:
      - path: Inventario
    # NOTE: Info.plist is hand-maintained at Inventario/Info.plist (contains
    # keys not representable here: orientations, CFBundleURLTypes). Do NOT add
    # an `info:` block: XcodeGen would regenerate and clobber that file.
    settings:
      DEVELOPMENT_TEAM: "4YK6GDPC39"
      PRODUCT_BUNDLE_IDENTIFIER: com.inventario.app
      INFOPLIST_FILE: Inventario/Info.plist
      SWIFT_VERSION: "5"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  InventarioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: InventarioTests
    dependencies:
      - target: Inventario
    settings:
      SWIFT_VERSION: "5"
      PRODUCT_BUNDLE_IDENTIFIER: com.inventario.tests
      GENERATE_INFOPLIST_FILE: "YES"
